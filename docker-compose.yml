services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: aegyptus
      POSTGRES_USER: aegyptus
      POSTGRES_PASSWORD: dev
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    profiles: [dev, full]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    profiles: [dev, full]

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    profiles: [full]

volumes:
  pgdata:
  miniodata:
